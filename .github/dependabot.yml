version: 2
updates:
  # --- npm dependencies ------------------------------------------------------
  - package-ecosystem: npm
    directory: '/'
    # Send dependency PRs to develop so they flow through the same
    # develop -> main path as everything else (lint+test on the develop PR,
    # production build when develop merges to main). Drop this line to target
    # the repository's default branch instead.
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    # Cap concurrent PRs so a quiet week doesn't open a dozen at once.
    open-pull-requests-limit: 5
    # Group related packages into a single PR instead of one per package.
    # The Angular framework moves in lockstep — 15+ @angular/* packages
    # bumping separately would be 15 PRs for one logical update.
    groups:
      angular:
        patterns:
          - '@angular/*'
          - '@angular-eslint/*'
          - 'angular-eslint'
      ngrx:
        patterns:
          - '@ngrx/*'
      eslint:
        patterns:
          - 'eslint'
          - '@eslint/*'
          - 'typescript-eslint'
          - 'eslint-config-prettier'
      vitest:
        patterns:
          - 'vitest'
          - '@vitest/*'
          - 'happy-dom'
    # Angular 22's compiler-cli pins TypeScript to ">=6.0 <6.1", so a 6.1 MINOR
    # (not just a 7.0 major) would break the peer range. Restrict Dependabot to
    # TypeScript PATCH bumps; move the TS line deliberately when you change the
    # Angular major.
    ignore:
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'

  # --- GitHub Actions versions ----------------------------------------------
  # Keeps actions/checkout, actions/setup-node, etc. in ci.yml up to date.
  - package-ecosystem: github-actions
    directory: '/'
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    # Bundle all action bumps into a single PR.
    groups:
      actions:
        patterns:
          - '*'
