name: CI

# Lint + unit tests run on both branches. The production build runs only for
# main (pushes to main and PRs into main), and only after lint and test pass.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          # Angular 22 supports Node ^22.22.3 || ^24.15.0 || >=26.0.0.
          # Node 20 is no longer supported — do not downgrade.
          node-version: '24.16.0'
          cache: 'npm'

      - name: Install dependencies
        # .npmrc sets legacy-peer-deps=true so npm ci resolves while @ngrx/*
        # still declares an Angular 21 peer. Remove that line + regenerate the
        # lockfile once NgRx ships v22.
        run: npm ci

      - name: Lint
        run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.16.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Test
        # The @angular/build:unit-test (Vitest) builder defaults to watch mode;
        # CI must run once and exit with a status code.
        # For coverage, append --coverage (@vitest/coverage-v8 is installed).
        run: npm test -- --watch=false

  build:
    name: Build (production)
    runs-on: ubuntu-latest
    # Run only after lint and test pass — a red lint/test skips the build.
    needs: [lint, test]
    # Deploy-branch gate: run only on pushes to main and PRs whose base is main.
    # On develop, lint + test still run; the prod build is skipped.
    # To build on develop too, delete this `if:` line.
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.16.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        # Production configuration — exercises budgets and prod-only optimization
        # that the dev build used by `ng test` does not.
        run: npm run build
